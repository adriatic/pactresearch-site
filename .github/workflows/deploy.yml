name: Deploy to Vultr

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vultr
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 45.77.191.105
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: "index.html,blog/*.html"
          target: /var/www/pactresearch.net
          strip_components: 0
